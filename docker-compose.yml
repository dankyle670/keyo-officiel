version: "3.8"
# Environnement de développement Keyo.
# Plus tard : admin (Next.js).
services:
  mobile:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
    # Réseau de l'hôte : Metro annonce l'IP du réseau local, joignable par l'iPhone.
    network_mode: host
    environment:
      # IP de la machine sur le Wi-Fi (hostname -I), à adapter : c'est l'adresse encodée dans le QR code.
      REACT_NATIVE_PACKAGER_HOSTNAME: ${KEYO_LAN_IP:-192.168.1.105}
      EXPO_PUBLIC_MAPBOX_TOKEN: ${EXPO_PUBLIC_MAPBOX_TOKEN:-}
    volumes:
      # Code monté pour le rechargement à chaud ; node_modules reste celui de l'image.
      - ./apps/mobile/app:/repo/apps/mobile/app
      - ./apps/mobile/src:/repo/apps/mobile/src
      - ./packages/shared/src:/repo/packages/shared/src
      - ./packages/tokens/src:/repo/packages/tokens/src
      # Session Expo CLI de l'hôte (npx expo login) : exigée quand Expo Go est connecté à un compte.
      - ${HOME}/.expo:/root/.expo
    tty: true
    stdin_open: true

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Réseau de l'hôte : l'iPhone joint l'API sur l'IP Wi-Fi de la machine, port 3000.
    network_mode: host
    # Clé Claude et réglages : apps/api/.env (copie de .env.example, jamais commité).
    env_file: apps/api/.env
    volumes:
      - ./apps/api/src:/repo/apps/api/src
      - ./apps/api/prisma:/repo/apps/api/prisma
      - ./packages/shared/src:/repo/packages/shared/src
    depends_on:
      - postgres
    # Déclencheurs des agents autonomes : ajouter REDIS_URL=redis://localhost:6379 dans apps/api/.env.

  # File des agents autonomes (BullMQ). Image légère, données dans un volume nommé.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  # Base de données Keyo (abonnements, puis biens et contrats). Image légère.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: keyo
      POSTGRES_PASSWORD: keyo
      POSTGRES_DB: keyo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  redis-data:
  postgres-data:
