<!doctype html>

<div style="width: 412px; height: 915px; position: relative; overflow: hidden; background: #F3F6F9; color: #0B1B33; font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif; box-sizing: border-box">

<div style="width: 42px; height: 42px; border-radius: 999px; background: #0B1B33; color: #2ED47A; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; flex: none">DK</div><div><div style="font-size: 17px; font-weight: 800">Daniel K.</div><div style="font-size: 13px; color: #5A6A80">Votre propriétaire</div></div>

<main style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 14px">
<div style="align-self: center; font-size: 12px; font-weight: 700; color: #5A6A80">Hier</div>
<div style="align-self: flex-end; max-width: 78%"><div style="background: #0B1B33; color: #FFFFFF; padding: 13px 17px; border-radius: 22px 22px 6px 22px; font-size: 15px; line-height: 22px">Bonjour, il y a une fuite sous le lavabo de la salle de bain. J'ai envoyé des photos.</div><div style="font-size: 12px; color: #5A6A80; margin: 4px 6px 0 0; text-align: right">9 h 14</div></div>
<div style="align-self: flex-start; max-width: 78%"><div style="background: #FFFFFF; padding: 13px 17px; border-radius: 22px 22px 22px 6px; font-size: 15px; line-height: 22px">Merci Fatou. J'ai validé le devis de Plomberie Koné, ils passent demain à 9 h.</div><div style="font-size: 12px; color: #5A6A80; margin: 4px 0 0 6px">18 h 42</div></div>
<div style="align-self: flex-end; max-width: 78%"><div style="background: #0B1B33; color: #FFFFFF; padding: 13px 17px; border-radius: 22px 22px 6px 22px; font-size: 15px; line-height: 22px">Parfait, je serai là. Merci beaucoup.</div><div style="font-size: 12px; color: #5A6A80; margin: 4px 6px 0 0; text-align: right">18 h 50</div></div>
<div style="align-self: center; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; background: #E9EFF5; font-size: 13px; font-weight: 700; color: #0B1B33"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2F5BEA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2"></path></svg> Intervention demain à 9 h</div>
</main>
<form style="position: absolute; left: 12px; right: 12px; bottom: 24px; height: 60px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 8px">
<button type="button" aria-label="Joindre une photo" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: none; color: #5A6A80; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1zM12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"></path></svg></button>

<input id="m" type="text" placeholder="Écrire un message" style="flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; font-size: 16px; color: #0B1B33">
<button type="submit" aria-label="Envoyer" style="width: 48px; height: 48px; border-radius: 999px; border: 0; background: #2ED47A; color: #0B1B33; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"></path></svg></button>
