<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Keyo Locataire · Passeport, partage</title>

<div style="width: 412px; height: 915px; position: relative; overflow: hidden; background: #F3F6F9; color: #0B1B33; font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif; box-sizing: border-box">
<header style="padding: 44px 20px 0; display: flex; align-items: center; gap: 4px; min-height: 64px"><button type="button" aria-label="Retour" style="width: 48px; height: 48px; border: 0; background: none; color: #0B1B33; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-left: -12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M15 6l-6 6 6 6"></path></svg></button><h1 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 800; letter-spacing: -0.01em; font-size: 22px; flex: 1">Partager mon passeport</h1></header>

<h2 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 800; letter-spacing: -0.01em; margin-top: 14px">La banque verra</h2>
<div style="font-size: 15px; line-height: 24px">Votre score, l'historique de vos loyers, votre identité vérifiée et le montant de votre loyer.</div>
<a href="#" style="font-size: 14px; font-weight: 700; text-decoration: none">Choisir ce que je partage</a>
<h2 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 800; letter-spacing: -0.01em; margin-top: 14px">Pendant</h2>
<div style="display: flex; padding: 4px; border-radius: 999px; background: #FFFFFF"><button type="button" aria-pressed="false" style="flex: 1; height: 44px; border-radius: 999px; border: 0; background: rgba(0,0,0,0); color: #0B1B33; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">7 jours</button><button type="button" aria-pressed="true" style="flex: 1; height: 44px; border-radius: 999px; border: 0; background: #0B1B33; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">30 jours</button><button type="button" aria-pressed="false" style="flex: 1; height: 44px; border-radius: 999px; border: 0; background: rgba(0,0,0,0); color: #0B1B33; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">90 jours</button></div>

<div style="position: absolute; left: 20px; right: 20px; bottom: 30px; display: flex; flex-direction: column; gap: 12px; align-items: center">
<button type="button" style="height: 56px; border: 0; border-radius: 999px; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; background: #2ED47A; color: #0B1B33; width: 100%">Partager pendant 30 jours</button>

</div>
