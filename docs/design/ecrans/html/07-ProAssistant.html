<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F6F9; color: #0B1B33; font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif; box-sizing: border-box">

<header style="padding: 62px 24px 0; display: flex; align-items: center; gap: 12px">

<div style="display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 16px; line-height: 24px">Depuis janvier, la villa vous a rapporté</div>
<div><span style="font-size: 36px; font-weight: 800; color: #0B1B33; font-variant-numeric: tabular-nums; white-space: nowrap">3 805 000 <span style="font-size: 25px; font-weight: 600; color: #5A6A80">FCFA nets</span></span></div>
<div style="display: flex; align-items: flex-end; gap: 6px; height: 58px; margin-top: 4px" role="img" aria-label="Revenus mensuels stables, avec un creux en avril"><div style="flex: 1; height: 58px; border-radius: 6px; background: #2ED47A"></div><div style="flex: 1; height: 58px; border-radius: 6px; background: #2ED47A"></div><div style="flex: 1; height: 58px; border-radius: 6px; background: #2ED47A"></div><div style="flex: 1; height: 50px; border-radius: 6px; background: #F79009"></div><div style="flex: 1; height: 58px; border-radius: 6px; background: #2ED47A"></div><div style="flex: 1; height: 58px; border-radius: 6px; background: #2ED47A"></div><div style="flex: 1; height: 58px; border-radius: 6px; background: #2ED47A"></div><div style="flex: 1; height: 58px; border-radius: 6px; background: #2ED47A"></div><div style="flex: 1; height: 58px; border-radius: 6px; background: #2ED47A"></div><div style="flex: 1; height: 58px; border-radius: 6px; background: #2ED47A"></div><div style="flex: 1; height: 58px; border-radius: 6px; background: #2ED47A"></div></div>
<div style="font-size: 14px; line-height: 20px; font-weight: 500; color: #5A6A80">Un seul creux en avril : une réparation de 45 000 FCFA.</div>
</div>
</main>
<div style="position: absolute; left: 0; right: 0; bottom: 120px; padding: 0 24px; display: flex; gap: 8px; overflow: hidden"><button type="button" style="flex: none; height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: #FFFFFF; color: #0B1B33; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Qui paie souvent en retard ?</button><button type="button" style="flex: none; height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: #FFFFFF; color: #0B1B33; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Mes dépenses ce mois</button><button type="button" style="flex: none; height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: #FFFFFF; color: #0B1B33; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Comparer mes biens</button></div>

<button type="submit" aria-label="Envoyer" style="width: 48px; height: 48px; border-radius: 999px; border: 0; background: #2ED47A; color: #0B1B33; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"></path></svg></button>
